# Build the container image from a release's archive and push it as
# ghcr.io/<owner>/mywhoosh-linux:<tag>.
#
# Releases only: `dist.sh --release` publishes the archive, and the image is
# that archive plus the runtime.  A game release changes nothing here -- the
# game lives in the user's volume and updates itself at launch.
name: image

on:
  release:
    types: [published]
  # To rebuild the image of an existing release, e.g. after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag is a release whose launcher pins it
        run: |
          gh release view "$TAG" --json tagName >/dev/null
          pinned=$(sed -n 's/^shim_release=//p' container/mywhoosh)
          if [ "$pinned" != "$TAG" ]; then
            echo "container/mywhoosh pins $pinned, not $TAG -- the launcher would run another image" >&2
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mywhoosh-linux" >> "$GITHUB_ENV"
          echo "PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        run: BUILDER=docker container/build.sh "$TAG"

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$PRERELEASE" != true ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
