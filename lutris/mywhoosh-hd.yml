name: MyWhoosh HD
game_slug: mywhoosh-hd
version: Microsoft Store
description: |
  Installs MyWhoosh HD from the Microsoft Store and lets your smart trainer and
  heart-rate strap connect through your computer's Bluetooth. Pair them from
  the game's device screen, as you would on Windows.

  Make sure Bluetooth is turned on and working before you start.

  You can also connect your sensors through your phone with the MyWhoosh
  Link app:
   - Android: https://play.google.com/store/apps/details?id=com.whoosh.companion
   - iOS: https://apps.apple.com/be/app/mywhoosh-link/id1561724525

slug: mywhoosh-hd-ms-store
runner: wine
script:
  variables:
    # The release the Bluetooth stack is fetched from.  `../dist.sh --release`
    # bumps this line; it is the one thing that says which build users get.
    shim_release: v0.1.2
  files:
    - downloader: https://raw.githubusercontent.com/Dj0ulo/ms-store-download/main/ms_store_download.py
    # The Bluetooth stack, as one versioned archive: two assemblies the game
    # loads instead of WinRT, the export shim it needs to poll its device list,
    # the Linux-side BlueZ helper, and the script Lutris runs to start and stop
    # that helper with the game.  One archive because the helper and the shim
    # inside the prefix speak a protocol between themselves -- fetched
    # separately, they are eventually different builds of it.
    - shim: https://github.com/Dj0ulo/mywhoosh-linux/releases/download/$shim_release/mywhoosh-bleshim-$shim_release.tar.gz
    # MyWhoosh HD renders with Direct3D 12, and the vkd3d-proton Lutris
    # installs (v2.14, the last in lutris/vkd3d) crashes it at startup: UE
    # creates a device on every GPU, and the first call after one on an Intel
    # iGPU reads a null pointer inside d3d12core.  3.0.1 does not.
    - vkd3d: https://github.com/HansKristian-Work/vkd3d-proton/releases/download/v3.0.1/vkd3d-proton-3.0.1.tar.zst
  game:
    exe: drive_c/MyWhooshHD/MyWhoosh.exe
    prefix: $GAMEDIR
    arch: win64
  wine:
    dxvk: true
    # "manual" makes Lutris set d3d12 and d3d12core native and leave the DLLs
    # in system32 alone -- which are the ones the installer puts there below.
    # Any version name instead would have it link its own v2.14 back in.
    vkd3d: true
    vkd3d_version: manual
  system:
    # The game's Bluetooth is answered from inside the prefix, but the hardware
    # is reached from outside it: BlueZ is on D-Bus, and Wine's winsock has no
    # AF_UNIX.  So a Linux helper runs alongside the game, and these two lines
    # are what make that automatic.  prelaunch_wait so the helper is listening
    # before the game's first scan -- it returns as soon as the port is up.
    prelaunch_command: $GAMEDIR/bleshim/mywhoosh-ble.sh start
    prelaunch_wait: true
    postexit_command: $GAMEDIR/bleshim/mywhoosh-ble.sh stop
    env:
      # Every layer -- the helper, the shim inside the prefix, the export
      # shim -- writes here, so one file explains a ride that found no sensors.
      MYWHOOSH_SHIM_LOG: $GAMEDIR/bleshim/session.log
      # Where mono finds the assemblies the game loads instead of WinRT.  Not
      # the prefix's mono tree: current Wine and Proton run wine-mono from the
      # runner's own directory and install none into the prefix, so there is
      # no tree there to put them in.  MONO_PATH is searched first whichever
      # mono runs, and it is read as a Windows path -- hence Z:, which is /.
      MONO_PATH: Z:$GAMEDIR/bleshim
  installer:
    - task:
        name: create_prefix
        prefix: $GAMEDIR
        arch: win64
    - mkdir: $GAMEDIR/drive_c/MyWhooshHD
    - mkdir: $CACHE
    - execute:
        description: Downloading MyWhoosh HD app from Microsoft Store
        file: python3
        args: $downloader 9nvdcph3xdz2 --download $CACHE --extract $GAMEDIR/drive_c/MyWhooshHD --extract-flat
    - move:
        src: $GAMEDIR/drive_c/MyWhooshHD/MyWhoosh/Binaries/Win64/MyWhoosh.exe
        dst: $GAMEDIR/drive_c/MyWhooshHD/MyWhoosh/Binaries/Win64/MyWhoosh-Win64-Shipping.exe
    # Lutris' own extract cannot open .tar.zst (Python's tarfile has no zstd
    # before 3.14), so tar does it.  Only the 64-bit DLLs go in: the game is.
    - mkdir: $GAMEDIR/vkd3d
    - execute:
        description: Installing vkd3d-proton 3.0.1
        file: tar
        args: --zstd -xf $vkd3d -C $GAMEDIR/vkd3d --strip-components=1
        disable_runtime: true
    - execute:
        file: cp
        # --remove-destination: were system32/d3d12.dll a symlink into Lutris'
        # runtime, a plain cp would write through it and replace Lutris' copy.
        args: --remove-destination $GAMEDIR/vkd3d/x64/d3d12.dll $GAMEDIR/vkd3d/x64/d3d12core.dll $GAMEDIR/drive_c/windows/system32/
        disable_runtime: true
    # WindowsConnectivity.dll is deliberately NOT patched: the game hashes it
    # and silently stops loading it if one byte differs.  What it is missing is
    # an assembly named `Windows`, which mono resolves by simple name -- so the
    # shim is unpacked here and MONO_PATH above points mono at it, and no game
    # file is touched.
    - mkdir: $GAMEDIR/bleshim
    - extract:
        file: shim
        dst: $GAMEDIR/bleshim
        # Named rather than guessed: Lutris guesses from the downloaded file's
        # name, and the archive only has to be renamed once for that to become
        # a silent no-op.
        format: tgz
    - chmodx: $GAMEDIR/bleshim/blehelper.py
    - chmodx: $GAMEDIR/bleshim/mywhoosh-ble.sh
    - execute:
        description: Checking the Bluetooth setup
        file: $GAMEDIR/bleshim/mywhoosh-ble.sh
        args: check
        # The helper is a Linux program; the Lutris runtime's library path is
        # what the system python3 must not be started under.
        disable_runtime: true
