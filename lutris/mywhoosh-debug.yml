name: MyWhoosh (debug)
game_slug: mywhoosh-debug
version: Local build
description: |
  mywhoosh.yml, but installing what is in this checkout rather than a release:
  the shim archive `../dist.sh` just built, and the MSIX cached in `../downloads/`
  so a fresh prefix does not cost a 2 GB download.

  Not installable as is -- run `lutris/debug.sh`, which builds the archive,
  fills in the checkout's path below, and hands the result to Lutris.

slug: mywhoosh-debug
runner: wine
script:
  variables:
    # Filled in by debug.sh: Lutris has no variable for where a script lives.
    repo: "@REPO@"
  files:
    - downloader: https://raw.githubusercontent.com/Dj0ulo/ms-store-download/main/ms_store_download.py
  game:
    exe: drive_c/MyWhoosh/MyWhoosh.exe
    prefix: $GAMEDIR
    arch: win64
  wine:
    dxvk: true
  system:
    prelaunch_command: $GAMEDIR/bleshim/mywhoosh-ble.sh start
    prelaunch_wait: true
    postexit_command: $GAMEDIR/bleshim/mywhoosh-ble.sh stop
    env:
      MYWHOOSH_SHIM_LOG: $GAMEDIR/bleshim/session.log
      MONO_PATH: Z:$GAMEDIR/bleshim
  installer:
    - task:
        name: create_prefix
        prefix: $GAMEDIR
        arch: win64
    - mkdir: $GAMEDIR/drive_c/MyWhoosh
    # The downloader skips a package already in its download directory when
    # the store's SHA256 matches, so only a new game version is fetched.
    - execute:
        description: Downloading MyWhoosh (or reusing ../downloads)
        file: python3
        args: $downloader 9ndh0f2vhzx2 --download $repo/downloads --extract $GAMEDIR/drive_c/MyWhoosh --extract-flat
    - move:
        src: $GAMEDIR/drive_c/MyWhoosh/MyWhoosh/Binaries/Win64/MyWhoosh.exe
        dst: $GAMEDIR/drive_c/MyWhoosh/MyWhoosh/Binaries/Win64/MyWhoosh-Win64-Shipping.exe
    - mkdir: $GAMEDIR/bleshim
    # Extracted straight from the checkout rather than listed under `files`:
    # Lutris 0.5.14 fetches those with requests, which has no file:// adapter.
    # debug.sh copies dist.sh's commit-named archive to this fixed name.
    - extract:
        file: $repo/build/mywhoosh-bleshim-debug.tar.gz
        dst: $GAMEDIR/bleshim
        format: tgz
    - chmodx: $GAMEDIR/bleshim/blehelper.py
    - chmodx: $GAMEDIR/bleshim/mywhoosh-ble.sh
    - execute:
        description: Checking the Bluetooth setup
        file: $GAMEDIR/bleshim/mywhoosh-ble.sh
        args: check
        disable_runtime: true
