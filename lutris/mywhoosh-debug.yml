name: MyWhoosh
game_slug: mywhoosh
version: Microsoft Store (in-app connectivity)
description: |
  Debug installer: same MSIX download as the normal one, but instead of patching
  WindowsConnectivity.dll it installs the in-app connectivity stack, so the game
  reaches its own Direct Connect path and can see a trainer on the Device
  Connection screen.

  The patch it replaces made the game start by making it stop loading
  WindowsConnectivity.dll at all -- MyWhoosh hashes that file and skips the load
  if a single byte differs -- so with it applied none of the below is reachable.
  Every piece here lives outside the game tree and leaves every game file
  byte-identical.

  Needs a checkout of https://github.com/Dj0ulo/mywhoosh-linux, and mono-devel,
  mingw-w64, p7zip and python3 to build it.  Point MYWHOOSH_LINUX at the
  checkout if it is not in ~/src/mywhoosh-linux.

  For a real trainer, run fakesensor/blebridge.py on the Linux side and set
  FAKESENSOR_EXTERNAL=1 below.  Without it the prefix serves one hard-coded
  sensor, which is what FAKESENSOR_NAME/POWER/BPM configure.

slug: mywhoosh-ms-store
runner: wine
script:
  files:
    - downloader: https://raw.githubusercontent.com/Dj0ulo/ms-store-download/main/ms_store_download.py
  game:
    exe: drive_c/MyWhoosh/MyWhoosh.exe
    prefix: $GAMEDIR
    arch: win64
  wine:
    dxvk: true
  system:
    env:
      # Wine cannot resolve the .local name the game gets back from discovery.
      LD_PRELOAD: $GAMEDIR/dotlocal_shim.so
      # The hard-coded sensor.  Set FAKESENSOR_EXTERNAL=1 to use blebridge.py
      # against real hardware instead.
      FAKESENSOR_NAME: FakeTrainer
      FAKESENSOR_POWER: '150'
      FAKESENSOR_BPM: '75'
      FAKESENSOR_LOG: $GAMEDIR/fakesensor.log
  installer:
    - task:
        name: create_prefix
        prefix: $GAMEDIR
        arch: win64
    - mkdir: $GAMEDIR/drive_c/MyWhoosh
    - execute:
        description: Downloading MyWhoosh app from Microsoft Store
        file: python3
        args: $downloader 9ndh0f2vhzx2 --download --extract $GAMEDIR/drive_c/MyWhoosh --extract-flat
    - move:
        src: $GAMEDIR/drive_c/MyWhoosh/MyWhoosh/Binaries/Win64/MyWhoosh.exe
        dst: $GAMEDIR/drive_c/MyWhoosh/MyWhoosh/Binaries/Win64/MyWhoosh-Win64-Shipping.exe
    # No patch step: WindowsConnectivity.dll stays pristine on purpose.
    - execute:
        description: Installing the in-app connectivity stack
        command: '"${MYWHOOSH_LINUX:-$HOME/src/mywhoosh-linux}/lutris/setup-connectivity.sh" "$GAMEDIR"'
